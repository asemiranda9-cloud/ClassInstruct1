<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile · ClassInstruct</title>
  <link rel="stylesheet" href="../sidebar.css" />
  <link rel="stylesheet" href="profile.css" />
  <script>
    (function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); })();
  </script>
</head>
<body data-page="profile">
<div class="app">
  <div class="main">
    <div class="page-frame visible">
      <div class="page-inner">

        <div class="page-header">
          <div class="page-title">My Profile</div>
          <div class="page-sub">View and edit your personal information</div>
        </div>

        <!-- Hero Card -->
        <div class="card">
          <div class="profile-hero">
            <div class="avatar-upload-wrap" id="avatarUploadWrap" onclick="triggerAvatarPick()" title="Change profile photo">
              <div class="profile-avatar-lg" id="profileAvatarLg">
                <img id="profileAvatarImg" src="" alt="" style="display:none;width:100%;height:100%;border-radius:50%;object-fit:cover;" />
                <span id="profileAvatarInitial">?</span>
              </div>
              <div class="avatar-overlay">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              </div>
              <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)" />
            </div>
            <div class="profile-hero-info">
              <div class="ph-name" id="profileFullName">—</div>
              <div class="ph-role">Instructor · ClassInstruct</div>
              <div class="ph-email" id="profileEmail">—</div>
              <button class="btn btn-ghost" style="margin-top:8px;font-size:12px;padding:6px 14px;" onclick="triggerAvatarPick()">📷 Change Photo</button>
            </div>
          </div>
          <div class="stat-grid">
            <div class="stat-card"><div class="stat-num">—</div><div class="stat-lbl">Students</div></div>
            <div class="stat-card"><div class="stat-num">—</div><div class="stat-lbl">Classes</div></div>
            <div class="stat-card"><div class="stat-num">—</div><div class="stat-lbl">Avg Attendance</div></div>
          </div>
        </div>

        <!-- Personal Info Card -->
        <div class="card">
          <div class="card-title">Personal Information</div>
          <div class="field-row">
            <div class="field">
              <label>First Name</label>
              <input type="text" id="profileFirstName" placeholder="First name" />
            </div>
            <div class="field">
              <label>Last Name</label>
              <input type="text" id="profileLastName" placeholder="Last name" />
            </div>
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" id="profileEmailInput" placeholder="Email address" />
          </div>
          <div class="field">
            <label>Gender</label>
            <select id="profileGender">
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field">
            <label>Phone</label>
            <input type="tel" id="profilePhone" placeholder="+63 912 345 6789" />
          </div>
          <div class="field">
            <label>Department</label>
            <input type="text" id="profileDept" placeholder="e.g. Science Department" />
          </div>
          <div class="field">
            <label>Bio</label>
            <textarea id="profileBio" placeholder="Tell us a little about yourself..."></textarea>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" onclick="saveProfile()">Save Profile</button>
            <button class="btn btn-ghost" onclick="discardChanges()">Discard</button>
          </div>
        </div>

        <!-- Activity Log -->
        <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
          <div>
            <div style="font-size:14px;font-weight:600;color:var(--text-primary);">Activity Log</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:3px;">View all your recent actions across ClassInstruct</div>
          </div>
          <button class="btn btn-ghost" onclick="goToActivityLog()" style="white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:7px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            View Activity Log
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
<script>
  function goToActivityLog() {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'CI_NAV', url: 'Profile/activity-log.html' }, '*');
    } else {
      window.location.href = 'activity-log.html';
    }
  }
</script>
<script src="../shared.js"></script>
<script src="profile.js"></script>
</body>
</html>

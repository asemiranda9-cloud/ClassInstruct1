<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logout — ClassInstruct</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0b0b15;
      color: #e8e8f4;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: #0f0f1a;
      border: 0.5px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: fadeUp 0.3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon-wrap {
      width: 56px;
      height: 56px;
      background: rgba(108,99,255,0.12);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .icon-wrap svg {
      width: 26px;
      height: 26px;
      stroke: #6c63ff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h2 {
      font-size: 18px;
      font-weight: 600;
      color: #f0f0f8;
      margin-bottom: 8px;
    }

    p {
      font-size: 13px;
      color: #55556e;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 11px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-cancel {
      background: rgba(255,255,255,0.06);
      color: #9898bb;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.1); }

    .btn-logout {
      background: #6c63ff;
      color: #fff;
    }
    .btn-logout:hover { background: #5a52e0; }
    .btn-logout:active { opacity: 0.85; }

    .btn-logout.loading {
      opacity: 0.7;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </div>
    <h2>Log out?</h2>
    <p>You'll be signed out of your ClassInstruct account. Any unsaved changes may be lost.</p>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="goBack()">Cancel</button>
      <button class="btn btn-logout" id="logoutBtn" onclick="doLogout()">Log Out</button>
    </div>
  </div>

  <script>
    function goBack() {
      // Go back in the top-level window if inside an iframe
      if (window.top !== window.self) {
        window.top.history.back();
      } else {
        history.back();
      }
    }

    function doLogout() {
      const btn = document.getElementById('logoutBtn');
      btn.textContent = 'Logging out…';
      btn.classList.add('loading');

      // logout.php destroys the session and redirects to homepage
      setTimeout(() => {
        window.top.location.href = 'logout.php';
      }, 600);
    }
  </script>

</body>
</html>

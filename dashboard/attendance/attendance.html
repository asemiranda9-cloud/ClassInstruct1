<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>ClassInstruct – Attendance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="attendance.css" />
  <script>
    // Apply saved theme instantly to prevent white flash
    (function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); })();
    // Listen for theme sync messages from sidebar/parent
    window.addEventListener('message', function(e) {
      if (e.data && (e.data.type === 'CI_THEME' || e.data.type === 'CI_SET_THEME')) {
        document.documentElement.setAttribute('data-theme', e.data.theme);
        localStorage.setItem('theme', e.data.theme);
      }
    });
  </script>
</head>
<body>

<!-- ══════════════════════════════════════════
     PIN GATE OVERLAY
══════════════════════════════════════════ -->
<div id="pinGate" style="
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-body,#f4f5fb);
">
  <div style="
    background:#fff;border-radius:20px;
    box-shadow:0 8px 40px rgba(79,70,229,.13);
    padding:40px 36px 32px;
    width:100%;max-width:360px;
    text-align:center;
  ">
    <!-- Lock icon -->
    <div style="width:56px;height:56px;border-radius:50%;background:rgba(79,70,229,.1);
      display:flex;align-items:center;justify-content:center;margin:0 auto 18px">
      <svg width="26" height="26" fill="none" stroke="#4f46e5" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M7 11V7a5 5 0 0110 0v4"/>
      </svg>
    </div>

    <div id="pinTitle" style="font-size:1.15rem;font-weight:700;color:#1e1b4b;margin-bottom:4px">Enter PIN</div>
    <div id="pinSub" style="font-size:0.82rem;color:#6b7280;margin-bottom:22px">Enter your 4-digit PIN to access Attendance</div>

    <!-- Dot display -->
    <div style="display:flex;justify-content:center;gap:14px;margin-bottom:20px" id="pinDots">
      <span class="pin-dot" style="width:14px;height:14px;border-radius:50%;border:2px solid #4f46e5;background:transparent;transition:background .15s"></span>
      <span class="pin-dot" style="width:14px;height:14px;border-radius:50%;border:2px solid #4f46e5;background:transparent;transition:background .15s"></span>
      <span class="pin-dot" style="width:14px;height:14px;border-radius:50%;border:2px solid #4f46e5;background:transparent;transition:background .15s"></span>
      <span class="pin-dot" style="width:14px;height:14px;border-radius:50%;border:2px solid #4f46e5;background:transparent;transition:background .15s"></span>
    </div>

    <!-- Error message -->
    <div id="pinError" style="font-size:0.8rem;color:#dc2626;min-height:18px;margin-bottom:10px"></div>

    <!-- Number pad -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto">
      <button class="pin-key" onclick="pinKey('1')">1</button>
      <button class="pin-key" onclick="pinKey('2')">2</button>
      <button class="pin-key" onclick="pinKey('3')">3</button>
      <button class="pin-key" onclick="pinKey('4')">4</button>
      <button class="pin-key" onclick="pinKey('5')">5</button>
      <button class="pin-key" onclick="pinKey('6')">6</button>
      <button class="pin-key" onclick="pinKey('7')">7</button>
      <button class="pin-key" onclick="pinKey('8')">8</button>
      <button class="pin-key" onclick="pinKey('9')">9</button>
      <button class="pin-key pin-key--del" onclick="pinBackspace()" style="font-size:1.1rem" aria-label="Backspace">⌫</button>
      <button class="pin-key" onclick="pinKey('0')">0</button>
      <button class="pin-key pin-key--clear" onclick="pinClear()" aria-label="Clear">C</button>
    </div>

    <!-- Physical keyboard hint -->
    <div style="margin-top:18px;font-size:0.75rem;color:#9ca3af">You can also type with your keyboard</div>
  </div>
</div>

<style>
  .pin-key {
    padding: 14px;
    border-radius: 12px;
    border: 1.5px solid #e5e7eb;
    background: #f9fafb;
    font-size: 1.1rem;
    font-weight: 600;
    color: #1e1b4b;
    cursor: pointer;
    transition: background .12s, border-color .12s, transform .08s;
    font-family: 'Inter', sans-serif;
  }
  .pin-key:hover { background: #ede9fe; border-color: #4f46e5; }
  .pin-key:active { transform: scale(.93); }
  .pin-key--del, .pin-key--clear { color: #6b7280; font-size: .85rem; }
  html[data-theme="dark"] #pinGate { background: #12112a; }
  html[data-theme="dark"] #pinGate > div { background: #1e1b4b; }
  html[data-theme="dark"] #pinTitle { color: #e0e0ff; }
  html[data-theme="dark"] #pinSub { color: #9ca3af; }
  html[data-theme="dark"] .pin-key { background: #2a2760; border-color: #3730a3; color: #e0e0ff; }
  html[data-theme="dark"] .pin-key:hover { background: #3730a3; }
</style>

<div class="app">
  <main class="main-content">

    <!-- ── Header ── -->
    <header class="page-header">
      <div class="page-header-left">
        <h1 class="page-title">Attendance</h1>
      </div>
      <div class="header-right">
        <div class="search-wrap">
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <label for="studentSearch" class="visually-hidden">Search students</label>
          <input type="search" id="studentSearch" placeholder="Search students…"
            oninput="filterStudents(this.value)" />
        </div>
      </div>
    </header>

    <!-- ── Global error banner (hidden by default) ── -->
    <div class="error-banner" id="errorBanner" role="alert" aria-live="assertive" style="display:none">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      </svg>
      <span id="errorMessage">An error occurred.</span>
      <button class="error-close" onclick="dismissError()" aria-label="Dismiss error">✕</button>
    </div>

    <div class="content-body">

      <!-- ── Summary Cards ── -->
      <section class="summary-section" aria-label="Attendance summary">
        <div class="summary-cards" id="summaryCards">
          <div class="summary-skeleton" aria-busy="true">
            <div class="skeleton-shimmer"></div>
          </div>
          <div class="summary-skeleton" aria-busy="true">
            <div class="skeleton-shimmer"></div>
          </div>
        </div>
      </section>

      <!-- ── Toolbar ── -->
      <div class="toolbar" role="toolbar" aria-label="Attendance filters">

        <!-- Section selector -->
        <div class="toolbar-group" style="position:relative">
          <button class="toolbar-btn" id="sectionBtn"
            onclick="toggleDropdown('sectionDropdown')"
            aria-haspopup="listbox" aria-expanded="false"
            aria-label="Select section">
            <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857
                   M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857
                   m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span id="sectionLabel">Loading…</span>
            <svg class="chevron" width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div id="sectionDropdown" class="dropdown-menu" role="listbox"
            aria-label="Sections" style="display:none"></div>
        </div>

        <!-- View mode tabs: Weekly / Daily -->
        <div class="toolbar-group view-tabs" role="group" aria-label="View mode">
          <button class="view-tab-btn view-tab-btn--active"
            data-view="week"
            onclick="Actions.toggleViewMode('week')"
            aria-label="Weekly view"
            aria-pressed="true">
            <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            Weekly
          </button>
          <button class="view-tab-btn"
            data-view="day"
            onclick="Actions.toggleViewMode('day')"
            aria-label="Daily view"
            aria-pressed="false">
            <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7a4 4 0 100 8 4 4 0 000-8zm0 0v1.5m0-1.5v6m0-7.5h6"/>
            </svg>
            Daily
          </button>
        </div>

        <!-- Week calendar picker -->
        <div class="toolbar-group" id="weekNav" style="position:relative">
          <button class="toolbar-btn" id="weekBtn"
            onclick="toggleDropdown('weekDropdown')"
            aria-haspopup="true" aria-expanded="false"
            aria-label="Select week">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span id="weekLabel">Loading…</span>
            <svg class="chevron" width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div id="weekDropdown" class="dropdown-menu cal-popup" style="display:none"></div>
        </div>

        <!-- Save Changes — shown only when pendingChanges queue has items -->
        <div class="toolbar-group" id="saveGroup">
          <button class="toolbar-btn toolbar-btn--save" id="saveChangesBtn"
            onclick="Actions.saveAllPending()"
            style="display:none"
            aria-label="Save all pending attendance changes">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1-4l-3 3m0 0l-3-3m3 3V4"/>
            </svg>
            <span id="saveChangesLabel">Save Changes</span>
          </button>
        </div>

        <!-- Monthly Report -->
        <div class="toolbar-group" id="reportGroup">
          <button class="toolbar-btn" id="monthlyReportBtn"
            onclick="Actions.openMonthlyReport()"
            aria-label="Generate Monthly Attendance Report">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            Monthly Report
          </button>
        </div>

      </div><!-- /toolbar -->

      <!-- ── Attendance Table ── -->
      <section id="weekView" aria-label="Weekly attendance grid">
        <div class="table-card">

          <!-- Inline save status toast -->
          <div class="save-toast" id="saveToast" role="status" aria-live="polite"></div>

          <div id="tableWrap" style="overflow-x:auto">
            <table class="att-table" id="attendanceTable">
              <thead id="tableHead"></thead>
              <tbody id="tableBody">
                <tr>
                  <td colspan="9" class="table-loading" aria-busy="true">
                    <span class="loading-spinner"></span>
                    Loading attendance…
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Empty state (shown via JS when no students) -->
          <div class="empty-state" id="emptyState" style="display:none">
            <svg width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283
                   -.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283
                   .356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <p>No students found for this section.</p>
          </div>

          <!-- Color legend + keyboard hint -->
          <div class="table-legend" id="tableLegend">
            <span class="legend-item">
              <span class="status-badge badge-present" style="min-width:auto;padding:2px 8px;pointer-events:none" aria-hidden="true">Present</span>
            </span>
            <span class="legend-item">
              <span class="status-badge badge-late" style="min-width:auto;padding:2px 8px;pointer-events:none" aria-hidden="true">Late</span>
            </span>
            <span class="legend-item">
              <span class="status-badge badge-absent" style="min-width:auto;padding:2px 8px;pointer-events:none" aria-hidden="true">Absent</span>
            </span>
            <span class="legend-item">
              <span class="status-badge badge-none" style="min-width:auto;padding:2px 8px;pointer-events:none" aria-hidden="true">&#8212;</span>
              <span class="legend-label" style="margin-left:4px">= No record</span>
            </span>
            <span class="legend-sep" aria-hidden="true"></span>
            <span class="legend-keyhint" aria-label="Use Tab to navigate cells, Space or Enter to cycle status">
              <kbd>Tab</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> / <kbd>Enter</kbd> to cycle
            </span>
          </div>

        </div>
      </section>

      <!-- ── Daily Focused View ── -->
      <section id="dayView" aria-label="Daily attendance view" style="display:none">
        <!-- dayView innerHTML is generated by Render.renderDayView() -->
      </section>

    </div><!-- /content-body -->
  </main>
</div>

<script src="../activity_log.js"></script>
<script src="attendance.js"></script>
</body>
</html>

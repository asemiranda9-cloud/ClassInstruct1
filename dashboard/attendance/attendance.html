<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>ClassInstruct – Attendance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="attendance.css" />
</head>
<body>
<div class="app">
  <main class="main-content">

    <!-- Header -->
    <header class="page-header">
      <h1 class="page-title">Attendance</h1>
    </header>

    <div class="content-body">

      <!-- Summary Cards -->
      <section class="summary-section">
        <div class="summary-cards" id="summaryCards">
          <div class="summary-skeleton">Loading summary…</div>
        </div>
      </section>

      <!-- Toolbar -->
      <div class="toolbar">

        <!-- Section selector -->
        <div class="toolbar-group" style="position:relative">
          <button class="toolbar-btn" id="sectionBtn" onclick="toggleDropdown('sectionDropdown')">
            <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span id="sectionLabel">Loading…</span>
            <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div id="sectionDropdown" class="dropdown-menu" style="display:none"></div>
        </div>

        <!-- Week calendar picker -->
        <div class="toolbar-group" id="weekNav" style="position:relative">
          <button class="toolbar-btn" id="weekBtn" onclick="toggleDropdown('weekDropdown')">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span id="weekLabel">Loading…</span>
            <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div id="weekDropdown" class="dropdown-menu cal-popup" style="display:none"></div>
        </div>

      </div><!-- /toolbar -->

      <!-- Attendance Table -->
      <section id="weekView">
        <div class="table-card">
          <div id="tableWrap" style="overflow-x:auto">
            <table class="att-table" id="attendanceTable">
              <thead id="tableHead"></thead>
              <tbody id="tableBody">
                <tr><td colspan="9" class="table-loading">Loading attendance…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

    </div><!-- /content-body -->
  </main>
</div>

<script src="attendance.js"></script>
</body>
</html>

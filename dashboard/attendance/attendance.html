<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>ClassInstruct - Attendance</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="classinstruct-AI">

      <!-- ══════════════════ SIDEBAR ══════════════════ -->
      <aside class="sidebar" role="navigation" aria-label="Main navigation">
        <div class="sidebar-logo">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="8" fill="#4f46e5"/>
            <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>ClassInstruct</span>
        </div>

        <div class="user-profile">
          <img src="../../image/Student.png" alt="Teacher profile picture" onerror="this.style.display='none'" />
          <div>
            <div class="user-name">Teacher</div>
            <div class="user-role">Instructor</div>
          </div>
        </div>

        <nav class="nav-menu">
          <button type="button" onclick="window.location.href='../dashboard.html'">
            <svg class="nav-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            <span>Dashboard</span>
          </button>
          <button type="button" onclick="window.location.href='../ai/classinstruct-ai.html'">
            <svg class="nav-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <span>ClassInstruct AI</span>
          </button>
          <button type="button" onclick="window.location.href='../Calendar/calendarPAGE.html'">
            <svg class="nav-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span>Calendar</span>
          </button>
          <button type="button" onclick="window.location.href='../Student/Student.html'">
            <svg class="nav-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            <span>Students</span>
          </button>
          <button type="button" onclick="window.location.href='../Student/StudentInfo.html'" class="student-info">
            <svg class="nav-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span>Student Info</span>
          </button>
          <button type="button" onclick="window.location.href='../Student/Grades.php'" class="grades">
            <svg class="nav-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            <span>Grades</span>
          </button>
          <button type="button" class="active">
            <svg class="nav-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
            </svg>
            <span>Attendance</span>
          </button>
        </nav>
      </aside>

      <!-- ══════════════════ MAIN ══════════════════ -->
      <main class="main-content">
        <header class="header">
          <h1 class="header-title">Attendance</h1>

          <div class="search-container">
            <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <label for="search-input" class="visually-hidden">Search</label>
            <input type="search" id="search-input" placeholder="Search students, sections..." aria-label="Search" oninput="filterTable()" />
          </div>

          <div class="header-actions">
            <span class="header-brand">ClassInstruct</span>
          </div>
        </header>

        <div class="content-wrapper">

          <!-- ── Summary Section ── -->
          <section class="summary-section">
            <h2 class="section-title">Attendance Summary</h2>
            <div class="summary-cards" id="summaryCards">
              <!-- Rendered by JS -->
              <div class="summary-card" style="opacity:.5;text-align:center;padding:40px">Loading summary…</div>
            </div>
          </section>

          <!-- ── Table Controls ── -->
          <div class="table-controls">
            <div style="position:relative">
              <button class="control-button" id="sectionBtn" onclick="toggleDropdown('sectionDropdown')">
                <span id="sectionLabel">Loading…</span>
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </button>
              <div id="sectionDropdown" class="dropdown-menu" style="display:none"></div>
            </div>

            <div style="position:relative">
              <button class="control-button" id="monthBtn" onclick="toggleDropdown('monthDropdown')">
                <span id="monthLabel">Loading…</span>
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </button>
              <div id="monthDropdown" class="dropdown-menu" style="display:none"></div>
            </div>
          </div>

          <!-- ── Attendance Table ── -->
          <section class="table-section">
            <div class="table-container">
              <div id="tableWrap" style="overflow-x:auto">
                <table class="attendance-table" id="attendanceTable">
                  <thead id="tableHead"></thead>
                  <tbody id="tableBody">
                    <tr><td colspan="32" style="text-align:center;padding:40px;opacity:.5">Loading attendance…</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

        </div><!-- /content-wrapper -->
      </main>
    </div><!-- /classinstruct-AI -->

    <!-- ══════════════════════════════════
         DROPDOWN STYLES (inline, small)
    ══════════════════════════════════ -->
    <style>
      .dropdown-menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-lg);
        z-index: 200;
        min-width: 160px;
        overflow: hidden;
      }
      .dropdown-menu button {
        display: block;
        width: 100%;
        padding: 10px 16px;
        background: none;
        border: none;
        text-align: left;
        font-size: 0.875rem;
        font-family: inherit;
        cursor: pointer;
        color: var(--text-primary);
        transition: background var(--transition-fast);
      }
      .dropdown-menu button:hover { background: var(--bg-input); }
      .dropdown-menu button.selected { color: var(--primary-color); font-weight: 600; }

      /* Status dots in table */
      .status-dot {
        display: inline-block;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        cursor: pointer;
        transition: transform 0.15s;
      }
      .status-dot:hover { transform: scale(1.3); }
      .dot-present { background: var(--status-present); }
      .dot-late    { background: var(--status-late); }
      .dot-absent  { background: var(--status-absent); }
      .dot-none    { background: #e2e8f0; }
    </style>

    <!-- ══════════════════════════════════
         JAVASCRIPT — wired to MySQL via attendance_db.php
    ══════════════════════════════════ -->
    <script>
    const API = 'attendance_db.php';

    // ── State ──
    let state = {
      sections:    [],
      sectionId:   1,
      sectionName: '',
      year:        new Date().getFullYear(),
      month:       new Date().getMonth() + 1,
    };

    const MONTHS = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];

    // ── Fetch helpers ──
    async function apiFetch(params) {
      const qs  = new URLSearchParams(params).toString();
      const res = await fetch(`${API}?${qs}`);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function apiPost(body) {
      const res = await fetch(API, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(body),
      });
      return res.json();
    }

    // ── Init ──
    async function init() {
      try {
        state.sections = await apiFetch({ action: 'sections' });
        if (state.sections.length) {
          state.sectionId   = state.sections[0].id;
          state.sectionName = state.sections[0].name;
        }
        buildSectionDropdown();
        buildMonthDropdown();
        await Promise.all([loadSummary(), loadAttendance()]);
      } catch (e) {
        showError('Could not connect to database. Is XAMPP running? — ' + e.message);
      }
    }

    // ── Dropdowns ──
    function toggleDropdown(id) {
      const el = document.getElementById(id);
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.table-controls')) {
        document.querySelectorAll('.dropdown-menu').forEach(d => d.style.display = 'none');
      }
    });

    function buildSectionDropdown() {
      const dd = document.getElementById('sectionDropdown');
      dd.innerHTML = state.sections.map(s =>
        `<button class="${s.id == state.sectionId ? 'selected' : ''}" onclick="selectSection(${s.id},'${escHtml(s.name)}')">${escHtml(s.name)}</button>`
      ).join('');
      document.getElementById('sectionLabel').textContent = state.sectionName || 'Select Section';
    }

    function buildMonthDropdown() {
      const dd = document.getElementById('monthDropdown');
      const now = new Date();
      let html  = '';
      // Show current year ±1
      for (let y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++) {
        for (let m = 1; m <= 12; m++) {
          const sel = (y === state.year && m === state.month) ? 'selected' : '';
          html += `<button class="${sel}" onclick="selectMonth(${y},${m})">${MONTHS[m-1]} ${y}</button>`;
        }
      }
      dd.innerHTML = html;
      updateMonthLabel();
    }

    function selectSection(id, name) {
      state.sectionId   = id;
      state.sectionName = name;
      document.getElementById('sectionLabel').textContent = name;
      document.getElementById('sectionDropdown').style.display = 'none';
      buildSectionDropdown();
      Promise.all([loadSummary(), loadAttendance()]);
    }

    function selectMonth(year, month) {
      state.year  = year;
      state.month = month;
      document.getElementById('monthDropdown').style.display = 'none';
      buildMonthDropdown();
      Promise.all([loadSummary(), loadAttendance()]);
    }

    function updateMonthLabel() {
      document.getElementById('monthLabel').textContent = `${MONTHS[state.month-1]} ${state.year}`;
    }

    // ── Summary Cards ──
    async function loadSummary() {
      const data = await apiFetch({ action: 'summary', year: state.year, month: state.month });
      const cards = document.getElementById('summaryCards');

      const mkCard = (title, d) => `
        <article class="summary-card">
          <div class="card-header">
            <h3>${escHtml(title)}</h3>
            <span class="badge present">Present</span>
          </div>
          <div class="card-value">${d.present}</div>
          <div class="breakdown">
            <div class="breakdown-item">
              <span class="breakdown-label">On-Time</span>
              <span class="breakdown-value">${d.present}</span>
              <span class="breakdown-percent">${d.present_pct}%</span>
            </div>
            <div class="breakdown-item">
              <span class="breakdown-label">Late</span>
              <span class="breakdown-value">${d.late}</span>
              <span class="breakdown-percent">${d.late_pct}%</span>
            </div>
            <div class="breakdown-item">
              <span class="breakdown-label">Absent</span>
              <span class="breakdown-value">${d.absent}</span>
              <span class="breakdown-percent absent">${d.absent_pct}%</span>
            </div>
          </div>
        </article>`;

      let html = mkCard('All Students', data.overall);
      const sec = data.sections.find(s => s.id == state.sectionId);
      if (sec) html += mkCard(sec.name, sec);
      cards.innerHTML = html;
    }

    // ── Attendance Table ──
    let tableData = { dates: [], students: [] };

    async function loadAttendance() {
      tableData = await apiFetch({
        action:     'attendance',
        section_id: state.sectionId,
        year:       state.year,
        month:      state.month,
      });
      renderTable();
    }

    function renderTable() {
      const { dates, students } = tableData;

      // Head
      const thead = document.getElementById('tableHead');
      thead.innerHTML = `<tr>
        <th class="student-col">Student</th>
        ${dates.map(d => {
          const dt   = new Date(d + 'T00:00:00');
          const day  = dt.toLocaleDateString('en-US', { weekday: 'short' });
          const num  = dt.getDate();
          return `<th title="${d}">${day}<br>${num}</th>`;
        }).join('')}
        <th>Summary</th>
      </tr>`;

      // Body
      const tbody = document.getElementById('tableBody');
      if (!students.length) {
        tbody.innerHTML = `<tr><td colspan="${dates.length + 2}" style="text-align:center;padding:40px;opacity:.5">No students found for this section.</td></tr>`;
        return;
      }

      tbody.innerHTML = students.map(s => {
        let present = 0, late = 0, absent = 0;
        const cells = dates.map(d => {
          const status = s.statuses[d] || 'none';
          if (status === 'present') present++;
          else if (status === 'late') late++;
          else if (status === 'absent') absent++;
          const cls = status === 'none' ? 'dot-none' : `dot-${status}`;
          const label = status === 'none' ? 'No record' : status.charAt(0).toUpperCase() + status.slice(1);
          return `<td><span class="status-dot ${cls}" title="${label} — ${d}" onclick="cycleStatus(${s.id},'${d}',this)"></span></td>`;
        }).join('');

        return `<tr data-name="${escHtml(s.full_name.toLowerCase())}">
          <td>
            <div class="student-name">
              <img src="${escHtml(s.avatar || '../../image/Student.png')}" alt="" class="student-avatar" onerror="this.style.display='none'"/>
              ${escHtml(s.full_name)}
            </div>
          </td>
          ${cells}
          <td style="font-size:0.78rem;white-space:nowrap;color:var(--text-secondary)">
            <span style="color:var(--status-present)">P:${present}</span>
            <span style="color:var(--status-late)"> L:${late}</span>
            <span style="color:var(--status-absent)"> A:${absent}</span>
          </td>
        </tr>`;
      }).join('');
    }

    // ── Click to cycle status: none → present → late → absent → present ──
    const CYCLE = { none: 'present', present: 'late', late: 'absent', absent: 'present' };

    async function cycleStatus(studentId, date, dot) {
      const currentClass = [...dot.classList].find(c => c.startsWith('dot-')) || 'dot-none';
      const current      = currentClass.replace('dot-', '');
      const next         = CYCLE[current] || 'present';

      // Optimistic UI update
      dot.classList.remove(currentClass);
      dot.classList.add(`dot-${next}`);
      dot.title = next.charAt(0).toUpperCase() + next.slice(1) + ' — ' + date;

      // Update local data
      const student = tableData.students.find(s => s.id == studentId);
      if (student) student.statuses[date] = next;

      // Persist to MySQL
      try {
        await apiPost({ student_id: studentId, date, status: next });
        // Refresh summary quietly
        loadSummary();
      } catch (e) {
        console.error('Save failed:', e);
      }
    }

    // ── Search / Filter ──
    function filterTable() {
      const q = document.getElementById('search-input').value.toLowerCase();
      document.querySelectorAll('#tableBody tr[data-name]').forEach(row => {
        row.style.display = row.dataset.name.includes(q) ? '' : 'none';
      });
    }

    // ── Error display ──
    function showError(msg) {
      document.getElementById('summaryCards').innerHTML =
        `<div class="summary-card" style="color:#ef4444;padding:20px">${escHtml(msg)}</div>`;
      document.getElementById('tableBody').innerHTML =
        `<tr><td colspan="32" style="text-align:center;padding:30px;color:#ef4444">${escHtml(msg)}</td></tr>`;
    }

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Start ──
    init();
    </script>
  </body>
</html>

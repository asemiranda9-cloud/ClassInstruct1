
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>ClassInstruct - Attendance</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="attedance.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="classinstruct-AI">


      <!-- ══════════════════ MAIN ══════════════════ -->
      <main class="main-content">
        <header class="header">
          <h1 class="header-title">Attendance</h1>

          <div class="search-container">
            <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <label for="search-input" class="visually-hidden">Search</label>
            <input type="search" id="search-input" placeholder="Search students, sections..." aria-label="Search" oninput="filterTable()" />
          </div>

          <div class="header-actions">
            <span class="header-brand">ClassInstruct</span>
          </div>
        </header>

        <div class="content-wrapper">

          <!-- ── Summary Section ── -->
          <section class="summary-section">
            <h2 class="section-title">Attendance Summary</h2>
            <div class="summary-cards" id="summaryCards">
              <div class="summary-card" style="opacity:.5;text-align:center;padding:40px">Loading summary…</div>
            </div>
          </section>

          <!-- ── Table Controls ── -->
          <div class="table-controls">
            <div style="position:relative">
              <button class="control-button" id="sectionBtn" onclick="toggleDropdown('sectionDropdown')">
                <span id="sectionLabel">Loading…</span>
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </button>
              <div id="sectionDropdown" class="dropdown-menu" style="display:none"></div>
            </div>

            <div style="display:flex;align-items:center;gap:4px">
              <button class="control-button" id="prevWeekBtn" onclick="shiftWeek(-1)" title="Previous week" style="padding:8px 10px">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
              </button>
              <div style="position:relative">
                <button class="control-button" id="weekBtn" onclick="toggleDropdown('weekDropdown')">
                  <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="flex-shrink:0">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                  </svg>
                  <span id="weekLabel">Loading…</span>
                  <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                  </svg>
                </button>
                <div id="weekDropdown" class="dropdown-menu cal-popup" style="display:none;overflow:visible">
                  <!-- Calendar rendered by attendance.js -->
                </div>
              </div>
              <button class="control-button" id="nextWeekBtn" onclick="shiftWeek(1)" title="Next week" style="padding:8px 10px">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- ── Attendance Table ── -->
          <section class="table-section">
            <div class="table-container">
              <div id="tableWrap" style="overflow-x:auto">
                <table class="attendance-table" id="attendanceTable">
                  <thead id="tableHead"></thead>
                  <tbody id="tableBody">
                    <tr><td colspan="9" style="text-align:center;padding:40px;opacity:.5">Loading attendance…</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

        </div><!-- /content-wrapper -->
      </main>
    </div><!-- /classinstruct-AI -->

    <script src="attedance.js"></script>
  </body>
</html>

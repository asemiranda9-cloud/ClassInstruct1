<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>ClassInstruct AI</title>
    <link rel="stylesheet" href="../sidebar.css" />
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply saved theme INSTANTLY before CSS renders — prevents flash
      (function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); })();
    </script>
  </head>
  <body data-page="classinstruct-ai" onload="applyTheme(localStorage.getItem('theme') || 'light')">
    <div class="classinstruct-AI">

      <!-- Main Content -->
      <main class="main-content">

        <!-- Header -->
        <header class="header">
          <h1 class="header-title">ClassInstruct AI</h1>

          <div class="search-container">
            <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <label for="search-input" class="visually-hidden">Search</label>
            <input type="search" id="search-input" placeholder="Search for lessons, students, or resources..." aria-label="Search" />
          </div>

          <div class="header-actions">
            <span class="header-brand">ClassInstruct AI</span>
          </div>
        </header>

        <!-- Content Wrapper -->
        <div class="content-wrapper">

          <!-- Chat Area -->
          <div class="chat-area">
            <div class="chat-container">
              <div class="chat-messages">
                <div class="welcome-message">
                  <h2>Welcome to ClassInstruct AI</h2>
                  <p>Ask me anything about your classes, students, or attendance.</p>
                </div>
              </div>
            </div>

            <!-- Chat Input -->
            <div class="chat-input-wrapper">
              <input type="file" id="file-input" accept=".pdf,.doc,.docx,.txt,.csv,.json,.png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm" style="display:none" />

              <div class="chat-input-container">
                <label for="chat-input" class="visually-hidden">Ask or search for anything</label>
                <input
                  type="text"
                  id="chat-input"
                  placeholder="Ask or search for anything..."
                  aria-label="Ask or search for anything"
                />
                <button type="button" class="action-button" id="mic-btn" aria-label="Voice input" title="Voice input">
                  <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
                  </svg>
                </button>
                <button type="button" class="action-button" id="attach-btn" aria-label="Attach file" title="Attach file">
                  <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                  </svg>
                </button>
                <button type="submit" class="action-button send-btn" aria-label="Send message">
                  <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                  </svg>
                </button>
              </div>

              <!-- Attached file preview bar -->
              <div id="attachment-preview" style="display:none; padding: 8px 12px; border-radius: 10px; margin-top: 8px; align-items:center; gap:10px; font-size:0.85rem;">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                <span id="attachment-name">file.pdf</span>
                <button onclick="clearAttachment()" style="margin-left:auto; background:none; border:none; cursor:pointer; font-size:1rem;" title="Remove file">✕</button>
              </div>
            </div>
          </div>

          <!-- Right Sidebar - Quick Actions -->
          <aside class="right-sidebar">
            <div class="sidebar-actions">

              <button type="button" class="icon-button" aria-label="Collapse" onclick="toggleSidebar()" title="Collapse Sidebar">
                <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
                </svg>
                <span class="icon-label">Collapse</span>
              </button>

              <button type="button" class="icon-button" aria-label="New Chat" onclick="newChat()" title="New Chat">
                <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span class="icon-label">New Chat</span>
              </button>

              <button type="button" class="icon-button" aria-label="Lesson Plan" onclick="openLessonPlan()" title="Lesson Plan">
                <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <span class="icon-label">Lesson Plan</span>
              </button>

              <button type="button" class="icon-button" aria-label="Interactive Quiz" onclick="openQuiz()" title="Interactive Quiz">
                <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                </svg>
                <span class="icon-label">Quiz</span>
              </button>

              <button type="button" class="icon-button" aria-label="History" onclick="openHistory()" title="History">
                <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span class="icon-label">History</span>
              </button>

            </div>
          </aside>

        </div><!-- /content-wrapper -->
      </main>
    </div>

    <script src="../shared.js"></script>
    <script src="app.js"></script>
  </body>
</html>

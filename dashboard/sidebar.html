<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassInstruct</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0b15; overflow: hidden; }
    .app { display: flex; height: 100vh; }

    .sb { width: 220px; background: #0f0f1a; display: flex; flex-direction: column; flex-shrink: 0; border-right: 0.5px solid rgba(255,255,255,0.06); }
    .sb-brand { display: flex; align-items: center; gap: 9px; padding: 20px 16px 16px; }
    .sb-icon { width: 28px; height: 28px; background: #6c63ff; border-radius: 7px; display: flex; align-items: center; justify-content: center; }
    .sb-icon svg { width: 14px; height: 14px; stroke: white; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .sb-name { color: #f0f0f8; font-size: 14px; font-weight: 600; }
    .sb-div { height: 0.5px; background: rgba(255,255,255,0.06); margin: 0 14px; }
    .sb-user { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
    .sb-avatar { width: 32px; height: 32px; background: linear-gradient(135deg, #6c63ff, #a78bfa); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .sb-uname { color: #e8e8f4; font-size: 12.5px; font-weight: 600; }
    .sb-urole { color: #555570; font-size: 11px; }
    .nav { padding: 10px 9px 0; flex: 1; }
    .nav-lbl { font-size: 9.5px; color: #3a3a55; text-transform: uppercase; letter-spacing: 0.9px; padding: 8px 8px 3px; font-weight: 600; }
    .ni { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 7px; color: #55556e; font-size: 12.5px; font-weight: 500; margin-bottom: 1px; text-decoration: none; transition: background 0.12s, color 0.12s; cursor: pointer; }
    .ni:hover { background: rgba(108,99,255,0.1); color: #b0afdd; }
    .ni.active { background: rgba(108,99,255,0.15); color: #a89fff; }
    .ni svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .ni.active svg { stroke: #6c63ff; }
    .dot { margin-left: auto; width: 5px; height: 5px; background: #6c63ff; border-radius: 50%; }
    .main { flex: 1; overflow: hidden; }
    iframe { width: 100%; height: 100vh; border: none; display: block; }
  </style>
</head>
<body>
  <div class="app">
    <div class="sb">
      <div class="sb-brand">
        <div class="sb-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
        <span class="sb-name">ClassInstruct</span>
      </div>
      <div class="sb-div"></div>
      <div class="sb-user">
        <div class="sb-avatar">T</div>
        <div><div class="sb-uname">Teacher</div><div class="sb-urole">Instructor</div></div>
      </div>
      <div class="sb-div"></div>
      <nav class="nav">
        <div class="nav-lbl">Main</div>
        <a class="ni" href="dashboard.html" target="main" onclick="setActive(this)">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>
        <a class="ni" href="ai/classinstruct-ai.html" target="main" onclick="setActive(this)">
          <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          ClassInstruct AI
        </a>
        <a class="ni" href="Calendar/calendarPAGE.html" target="main" onclick="setActive(this)">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Calendar
        </a>
        <div class="nav-lbl" style="margin-top:6px;">People</div>
        <a class="ni" href="Student/Student.html" target="main" onclick="setActive(this)">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          Students
        </a>

        <div class="nav-lbl" style="margin-top:6px;">Academics</div>
        <a class="ni" href="Student/Grades.php" target="main" onclick="setActive(this)">
          <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Grades
        </a>
        <a class="ni" href="attendance/attendance.html" target="main" onclick="setActive(this)">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          Attendance
        </a>
      </nav>
    </div>

    <!-- ✅ Single content iframe — all pages load here -->
    <div class="main">
      <iframe name="main" id="mainFrame" src="dashboard.html"></iframe>
    </div>
  </div>

  <script>
    // Set active nav item and add dot indicator
    function setActive(el) {
      document.querySelectorAll('.ni').forEach(n => {
        n.classList.remove('active');
        const d = n.querySelector('.dot');
        if (d) d.remove();
      });
      el.classList.add('active');
      const dot = document.createElement('span');
      dot.className = 'dot';
      el.appendChild(dot);
    }

    // Auto-highlight nav item based on iframe URL
    const frame = document.getElementById('mainFrame');
    frame.addEventListener('load', () => {
      try {
        const src = frame.contentWindow.location.href;
        document.querySelectorAll('.ni').forEach(n => {
          const href = n.getAttribute('href');
          if (href) {
            const fileName = href.split('/').pop();
            // If viewing StudentInfo, highlight Students nav item
            if (src.includes('StudentInfo') && href.includes('Student.html')) {
              setActive(n);
              return;
            }
            if (src.includes(fileName)) {
              setActive(n);
            }
          }
        });
      } catch(e) {}
    });

    // Highlight Dashboard link on load
    document.querySelector('.ni[href="dashboard.html"]').classList.add('active');
  </script>
</body>
</html>

          <button type="button" onclick="window.location.href='../attendance/attendance.html'">

      <!-- Main Content -->
      <main class="main-content">
        <header class="header">
          <h1 class="header-title">Calendar</h1>
          <div class="search-container">
            <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <label for="search-input" class="visually-hidden">Search</label>
            <input type="search" id="search-input" placeholder="Search events, schedules..." aria-label="Search" />
          </div>
          <div class="header-brand">ClassInstruct</div>
        </header>

        <div class="content-wrapper">
          <!-- Big Calendar -->
          <div class="calendar-container">
            <div class="calendar-header">
              <div class="calendar-month-year" id="calendarMonthYear">January 2026</div>

            </div>
            <div class="calendar-weekdays">
              <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            <div class="calendar-days" id="calendarDays"></div>
          </div>

          <!-- Schedule Sidebar -->
          <aside class="schedule-sidebar">
            <h3 class="sidebar-title">Schedule Details</h3>
            <div class="schedule-list" id="scheduleList">
              <!-- dynamically updated -->
            </div>
          </aside>
        </div>
      </main>
    </div>

    <!-- ── Day Modal ── -->
    <div class="modal-overlay" id="dayModal" role="dialog" aria-modal="true" aria-labelledby="modalDayNum">
      <div class="day-modal">
        <div class="modal-header">
          <div class="modal-date-badge">
            <span class="modal-day-num" id="modalDayNum">1</span>
            <span class="modal-month-name" id="modalMonthName">January 2026</span>
          </div>
          <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
        </div>

        <!-- Add entry form -->
        <div class="add-entry-form">
          <h4>Add to this day</h4>
          <div class="type-chips" id="typeChips">
            <button class="type-chip selected" data-type="holiday">🌿 Holiday</button>
            <button class="type-chip" data-type="event">📅 Event</button>
            <button class="type-chip" data-type="meeting">🤝 Meeting</button>
            <button class="type-chip" data-type="note">📝 Note</button>
            <button class="type-chip" data-type="exam">📋 Exam</button>
            <button class="type-chip" data-type="activity">🎯 Activity</button>
            <button class="type-chip" data-type="quiz">❓ Quiz</button>
          </div>
          <div class="entry-text-row">
            <input type="text" id="entryTitle" placeholder="Title (e.g. Science Exam)" maxlength="60" />
            <input type="time" id="entryTime" class="entry-time-input" />
          </div>
          <textarea class="entry-note-area" id="entryNote" placeholder="Add a note or description (optional)..." maxlength="300"></textarea>
          <button class="btn-add-entry" onclick="addEntry()">+ Add Entry</button>
        </div>

        <!-- Entries list -->
        <div id="entriesListSection">
          <div class="entries-list-title">Entries</div>
          <div class="entries-list" id="entriesList"></div>
        </div>
      </div>
    </div>

    <script>
      // ── State ──
      const calendarData = {
        months: [
          { name: 'January',   days: 31, startDay: 3 },
          { name: 'February',  days: 28, startDay: 6 },
          { name: 'March',     days: 31, startDay: 6 },
          { name: 'April',     days: 30, startDay: 2 },
          { name: 'May',       days: 31, startDay: 4 },
          { name: 'June',      days: 30, startDay: 0 },
          { name: 'July',      days: 31, startDay: 2 },
          { name: 'August',    days: 31, startDay: 5 },
          { name: 'September', days: 30, startDay: 1 },
          { name: 'October',   days: 31, startDay: 3 },
          { name: 'November',  days: 30, startDay: 6 },
          { name: 'December',  days: 31, startDay: 1 }
        ],
        currentMonthIndex: 0,
        currentYear: 2026
      };

      // dayEntries: key = "YYYY-MM-DD", value = array of entry objects
      let dayEntries = JSON.parse(localStorage.getItem('ci_dayEntries') || '{}');

      let selectedType = 'holiday';
      let modalKey = null; // current open day key

      const typeIcons = { holiday: '🌿', event: '📅', meeting: '🤝', note: '📝', exam: '📋', activity: '🎯', quiz: '❓' };

      function dayKey(year, monthIdx, day) {
        return `${year}-${String(monthIdx+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      }

      function saveEntries() {
        localStorage.setItem('ci_dayEntries', JSON.stringify(dayEntries));
      }

      // ── Type chip selection ──
      document.getElementById('typeChips').addEventListener('click', e => {
        const chip = e.target.closest('.type-chip');
        if (!chip) return;
        document.querySelectorAll('.type-chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        selectedType = chip.dataset.type;
      });

      // ── Modal open/close ──
      function openModal(day) {
        modalKey = dayKey(calendarData.currentYear, calendarData.currentMonthIndex, day);
        document.getElementById('modalDayNum').textContent = day;
        document.getElementById('modalMonthName').textContent =
          calendarData.months[calendarData.currentMonthIndex].name + ' ' + calendarData.currentYear;
        document.getElementById('entryTitle').value = '';
        document.getElementById('entryTime').value = '';
        document.getElementById('entryNote').value = '';
        renderEntriesList();
        document.getElementById('dayModal').classList.add('open');
        document.getElementById('entryTitle').focus();
      }

      function closeModal() {
        document.getElementById('dayModal').classList.remove('open');
        modalKey = null;
      }

      // close on backdrop click
      document.getElementById('dayModal').addEventListener('click', e => {
        if (e.target === document.getElementById('dayModal')) closeModal();
      });

      // close on Escape
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

      // ── Add entry ──
      function addEntry() {
        const title = document.getElementById('entryTitle').value.trim();
        if (!title) { document.getElementById('entryTitle').focus(); return; }
        const time  = document.getElementById('entryTime').value;
        const note  = document.getElementById('entryNote').value.trim();

        if (!dayEntries[modalKey]) dayEntries[modalKey] = [];
        dayEntries[modalKey].push({
          id: Date.now(),
          type: selectedType,
          title,
          time: time ? formatTime(time) : '',
          note
        });
        saveEntries();

        document.getElementById('entryTitle').value = '';
        document.getElementById('entryTime').value = '';
        document.getElementById('entryNote').value = '';

        renderEntriesList();
        renderCalendar();
        renderScheduleSidebar();
      }

      function formatTime(t) {
        const [h, m] = t.split(':').map(Number);
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = h % 12 || 12;
        return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
      }

      // ── Delete entry ──
      function deleteEntry(key, id) {
        dayEntries[key] = (dayEntries[key] || []).filter(e => e.id !== id);
        if (dayEntries[key].length === 0) delete dayEntries[key];
        saveEntries();
        renderEntriesList();
        renderCalendar();
        renderScheduleSidebar();
      }

      // ── Render entries in modal ──
      function renderEntriesList() {
        const list = document.getElementById('entriesList');
        const entries = dayEntries[modalKey] || [];
        if (entries.length === 0) {
          list.innerHTML = '<div class="empty-day-msg"><span>📋</span>No entries yet. Add one above!</div>';
          return;
        }
        list.innerHTML = entries.map(e => `
          <div class="entry-card" data-type="${e.type}">
            <span class="entry-icon">${typeIcons[e.type]}</span>
            <div class="entry-body">
              <div class="entry-title-text">${escHtml(e.title)}</div>
              <div class="entry-meta">
                ${e.time ? `<span class="entry-time-badge">⏱ ${escHtml(e.time)}</span>` : ''}
                <span class="entry-type-label">${capitalize(e.type)}</span>
              </div>
              ${e.note ? `<div class="entry-note-text">${escHtml(e.note)}</div>` : ''}
            </div>
            <button class="btn-delete-entry" onclick="deleteEntry('${modalKey}', ${e.id})" aria-label="Delete entry">✕</button>
          </div>
        `).join('');
      }

      // ── Render schedule sidebar ──
      function renderScheduleSidebar() {
        const list = document.getElementById('scheduleList');
        // Collect all entries for the current month
        const prefix = `${calendarData.currentYear}-${String(calendarData.currentMonthIndex+1).padStart(2,'0')}-`;
        const items = [];
        Object.entries(dayEntries).forEach(([k, arr]) => {
          if (k.startsWith(prefix)) {
            const day = parseInt(k.split('-')[2]);
            arr.forEach(e => items.push({ day, ...e }));
          }
        });
        items.sort((a, b) => a.day - b.day);

        if (items.length === 0) {
          list.innerHTML = '<div class="empty-day-msg"><span>🗓️</span>No events this month.<br>Click a day to add some!</div>';
          return;
        }

        const typeClass = { holiday: 'events', event: 'academic', meeting: 'academic', note: 'events', exam: 'academic', activity: 'events', quiz: 'academic' };
        list.innerHTML = items.map(e => `
          <article class="schedule-item ${typeClass[e.type] || 'events'}">
            <div class="schedule-time">
              <span class="sched-day">Day ${e.day}</span>
              ${e.time ? `<span class="sched-hour">${escHtml(e.time)}</span>` : ''}
            </div>
            <div class="schedule-content">
              <span class="schedule-title">${typeIcons[e.type]} ${escHtml(e.title)}</span>
              <span class="schedule-type">${capitalize(e.type)}</span>
            </div>
          </article>
        `).join('');
      }

      // ── Render calendar ──
      function renderCalendar() {
        const month = calendarData.months[calendarData.currentMonthIndex];
        document.getElementById('calendarMonthYear').textContent = month.name + ' ' + calendarData.currentYear;
        const daysContainer = document.getElementById('calendarDays');
        daysContainer.innerHTML = '';

        const today = new Date();
        const isCurrentMonth = today.getMonth() === calendarData.currentMonthIndex &&
                               today.getFullYear() === calendarData.currentYear;
        const todayDate = today.getDate();
        const prevMonth = calendarData.currentMonthIndex === 0 ? 11 : calendarData.currentMonthIndex - 1;
        const prevMonthDays = calendarData.months[prevMonth].days;

        // prev month padding
        for (let i = month.startDay - 1; i >= 0; i--) {
          const d = document.createElement('div');
          d.className = 'calendar-day other-month';
          d.innerHTML = `<span class="day-number">${prevMonthDays - i}</span>`;
          daysContainer.appendChild(d);
        }

        // current month days
        for (let day = 1; day <= month.days; day++) {
          const key = dayKey(calendarData.currentYear, calendarData.currentMonthIndex, day);
          const entries = dayEntries[key] || [];
          const d = document.createElement('div');
          d.className = 'calendar-day';
          if (isCurrentMonth && day === todayDate) d.classList.add('today');
          if (entries.length > 0) d.classList.add('has-event');

          // dot colors
          const uniqueTypes = [...new Set(entries.map(e => e.type))];
          const dots = uniqueTypes.map(t => `<span class="day-dot ${t}"></span>`).join('');

          d.innerHTML = `
            <span class="day-number">${day}</span>
            ${dots ? `<div class="day-dots">${dots}</div>` : ''}
            ${entries.length > 0 ? `<div class="event-indicator">${escHtml(entries[0].title)}${entries.length > 1 ? ` +${entries.length-1}` : ''}</div>` : ''}
          `;
          d.setAttribute('role', 'button');
          d.setAttribute('tabindex', '0');
          d.setAttribute('aria-label', `${month.name} ${day}, ${calendarData.currentYear}${entries.length ? `, ${entries.length} entr${entries.length>1?'ies':'y'}` : ''}`);
          d.addEventListener('click', () => openModal(day));
          d.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openModal(day); });
          daysContainer.appendChild(d);
        }

        // next month padding
        const totalCells = month.startDay + month.days;
        const remaining = totalCells > 35 ? 42 - totalCells : 35 - totalCells;
        for (let day = 1; day <= remaining; day++) {
          const d = document.createElement('div');
          d.className = 'calendar-day other-month';
          d.innerHTML = `<span class="day-number">${day}</span>`;
          daysContainer.appendChild(d);
        }
      }

      function changeMonth(dir) {
        calendarData.currentMonthIndex += dir;
        if (calendarData.currentMonthIndex < 0)  { calendarData.currentMonthIndex = 11; calendarData.currentYear--; }
        if (calendarData.currentMonthIndex > 11) { calendarData.currentMonthIndex = 0;  calendarData.currentYear++; }
        renderCalendar();
        renderScheduleSidebar();
      }

      // ── Helpers ──
      function escHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
      function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

      // ── Init ──
      document.addEventListener('DOMContentLoaded', () => {
        renderCalendar();
        renderScheduleSidebar();
      });

      // allow Enter to submit
      document.getElementById('entryTitle').addEventListener('keydown', e => { if (e.key === 'Enter') addEntry(); });
    </script>
